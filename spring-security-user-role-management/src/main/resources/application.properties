# ==============================================================================
# CAMPUSDESK - Configuración de Propiedades de la Aplicación
# ==============================================================================

# Puerto del servidor
server.port=${PORT:${SERVER_PORT:8056}}
server.forward-headers-strategy=framework

# Base de datos: Base de datos H2 embebida (cero dependencias, arranca en cualquier PC)
# Si se pasa DB_URL externa (ej. PostgreSQL en Docker), se conecta a ella automáticamente
spring.datasource.url=${DB_URL:jdbc:h2:mem:sistema_gestion_usuarios;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Inicialización automática del esquema con Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Consola H2 para inspección de base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Servir Frontend estático desde src/main/resources/static
spring.web.resources.static-locations=classpath:/static/

# Configuración JWT (HMAC256) con clave mínima de 32 caracteres por defecto
security.jwt.secret=${JWT_SECRET:CampusDesk_Secret_Key_2026_Secure_Token_Min32Chars!}
security.jwt.issuer=${JWT_ISSUER:CampusDesk_API}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuración CORS permisivo para evitar bloqueos
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Configuración Spring Data Redis (con respaldo transparente en memoria si Redis no está activo)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=1000ms
security.session.redis.ttl-seconds=${SESSION_TTL_SECONDS:28800}
