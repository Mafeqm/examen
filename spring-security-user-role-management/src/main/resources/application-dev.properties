# Desarrollo - PostgreSQL
server.port=${PORT:${SERVER_PORT:8056}}
server.forward-headers-strategy=framework

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/sistema_gestion_usuarios}}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:CampusDesk_Pass_2026!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Configuración JWT (HMAC256)
security.jwt.secret=${JWT_SECRET:CampusDesk_Secret_Key_2026_Secure_Token_Min32Chars!}
security.jwt.issuer=${JWT_ISSUER:CampusDesk_API}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuración CORS permisiva
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Configuración Spring Data Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=1000ms
security.session.redis.ttl-seconds=${SESSION_TTL_SECONDS:28800}
